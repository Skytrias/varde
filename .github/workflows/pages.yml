name: Publish Varde documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job receives only repository-read access. Deployment authority is
# isolated in the separate deploy job below.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Odin compiler
        shell: bash
        run: |
          set -euo pipefail
          source ci/toolchains/odin-linux-amd64.env
          curl --fail --location --retry 3 --retry-all-errors --output odin.tar.gz "$ODIN_LINUX_AMD64_URL"
          echo "$ODIN_LINUX_AMD64_SHA256  odin.tar.gz" | sha256sum --check
          toolchain_dir="$RUNNER_TEMP/varde-odin"
          mkdir -p "$toolchain_dir"
          tar --extract --gzip --file odin.tar.gz --strip-components=1 --directory "$toolchain_dir"
          rm odin.tar.gz
          echo "$toolchain_dir" >> "$GITHUB_PATH"

      - name: Test and build Varde
        run: |
          set -euo pipefail
          odin version
          make test
          make build-cli
          test -s dist/varde

      - name: Build the Varde documentation showcase
        run: |
          set -euo pipefail
          python3 tools/build_showcase.py --varde "$GITHUB_WORKSPACE/dist/varde" --output "$GITHUB_WORKSPACE/_site"
          test -f _site/index.html
          test -f _site/projects/varde/index.html
          test ! -e _site/projects/varde/odin
          test -f _site/projects/odin/index.html
          test -f _site/projects/karl2d/index.html
          test -f _site/projects/muninn/index.html
          test -f _site/projects/sokol-odin/index.html

      # This makes the executable available for troubleshooting or manual
      # testing. It is intentionally not a release asset or supported binary.
      - name: Upload Varde CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: varde-linux-amd64-ci
          path: dist/varde
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
